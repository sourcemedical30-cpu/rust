[package]
name = "recap_matcher"
version = "1.0.0"
edition = "2021"
description = "Rebuilds a recap video from the full movie with frame-exact timing"

[dependencies]
eframe = "0.29"
rfd = "0.15"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
anyhow = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
